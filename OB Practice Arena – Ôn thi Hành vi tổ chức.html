<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OB Practice Arena – Ôn thi Hành vi tổ chức</title>
<style>
:root{--bg:#f4f2ec;--dot:#e2dfd5;--card:#fff;--tx:#1b2a49;--mut:#6f7686;--bd:#d6d9e2;--pri:#1b2a49;--onp:#fff;--ac:#3b6fd4;--ok:#1f9d55;--okb:#e3f5ea;--no:#d64545;--nob:#fbe7e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--dot:#1b2130;--card:#192032;--tx:#e8ebf3;--mut:#9aa3b8;--bd:#2d364d;--pri:#8da2ff;--onp:#10141d;--ac:#8da2ff;--ok:#4cc27f;--okb:#1a3a2a;--no:#ff7b7b;--nob:#3d2020}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1px) 0 0/22px 22px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--pri);margin-bottom:20px}
.logo{display:flex;gap:12px;align-items:center}
.badge{background:var(--pri);color:var(--onp);font-weight:800;font-size:13px;letter-spacing:.5px;padding:6px 10px;border-radius:6px}
h1{margin:0;font-size:30px;line-height:1.1}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.pill{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 14px;font-size:13px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;margin-bottom:16px}
h2{margin:0 0 16px;font-size:15px;letter-spacing:1.2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
button{font:inherit;color:var(--tx);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.ch,.tg,.nv{background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;text-align:left;transition:.15s}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:600}
.ch small{font-size:12px;color:var(--mut);white-space:nowrap}
.ch.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card));box-shadow:0 0 0 1px var(--ac) inset}
.sl{display:flex;align-items:center;gap:14px}
.sl input{flex:1;accent-color:var(--pri);height:6px}
.sl b{font-size:24px;min-width:56px;text-align:right}
.sl span{color:var(--mut);font-size:14px;white-space:nowrap}
.tg{display:flex;justify-content:space-between;width:100%;margin-top:12px;font-weight:600}
.tg em{font-style:normal;font-size:13px;color:var(--mut)}
.tg.on{border-color:var(--ok)}.tg.on em{color:var(--ok);font-weight:700}
.go{width:100%;background:var(--pri);color:var(--onp);border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700}
.go:hover{filter:brightness(1.12)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.nv{padding:8px 14px;text-align:center}
.nv.p{background:var(--pri);color:var(--onp);border-color:var(--pri);font-weight:600}
.prog{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .2s}
.timer{font-weight:800;font-size:18px;color:var(--ac);margin-bottom:10px}
.timer.low{color:var(--no)}
.q{font-weight:700;font-size:18px;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:13px 14px;border-radius:10px;background:var(--bg);border:1.5px solid var(--bd);line-height:1.45}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:13px;background:var(--card)}
.opt:not(:disabled):hover{border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.opt:disabled{opacity:1;cursor:default}
.res{font-weight:700;min-height:26px}.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:8px}
.ex{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--bg);border-radius:8px;font-size:15px}.ex p{margin:0 0 8px}.ex p:last-child{margin:0}.ex .w{color:var(--mut)}
.end{text-align:center}.end .big{font-size:52px;font-weight:800;color:var(--ac)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:520px){h1{font-size:24px}.box{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo"><span class="badge">OB</span><div><h1>OB Practice Arena</h1><div class="sub">Ngân hàng câu hỏi — Hành vi tổ chức (Chương 1–5)</div></div></div>
<span class="pill mono" id="tot"></span>
</header>
<div id="app"></div>
</div>
<script>
const D={"chapters":["Chương 1: Tổng quan về hành vi tổ chức","Chương 2: Những cơ sở của hành vi cá nhân","Chương 3: Động lực trong công việc","Chương 4: Những cơ sở của hành vi nhóm","Chương 5: Văn hóa, thiết kế và thay đổi tổ chức"],"qs":[{"c":0,"n":1,"s":"Đề 1 – câu 1","q":"Lĩnh vực nghiên cứu OB đang phát triển nào quan tâm đến cách tổ chức phát huy thế mạnh của con người, nuôi dưỡng sức sống, khả năng phục hồi và khai mở tiềm năng?","o":["Nghiên cứu hành vi đạo đức","Cân bằng xung đột công việc – cuộc sống","Nghiên cứu tổ chức mạng lưới","Nghiên cứu tổ chức tích cực (positive organizational scholarship)"],"a":3,"e":"Nghiên cứu tổ chức tích cực (positive organizational scholarship) là lĩnh vực nghiên cứu cách tổ chức phát huy thế mạnh con người, nuôi dưỡng sức sống, khả năng phục hồi và khai mở tiềm năng, tức là tập trung vào điều tổ chức làm đúng thay vì điều làm sai.","w":"A, B, C là các chủ đề khác của OB, không phải tên của lĩnh vực này."},{"c":4,"n":2,"s":"Đề 1 – câu 2","q":"____ là ý thức về một mục đích rộng lớn hơn mà người lao động đưa vào nhiệm vụ của mình nhờ quá trình tương tác với nhau.","o":["Huyền thoại khởi nghiệp (foundation myth)","Ý nghĩa chung (shared meaning)","Biểu tượng văn hóa","Nghi lễ (rite)"],"a":1,"e":"Ý nghĩa chung (shared meaning) là ý thức về mục đích rộng lớn hơn mà người lao động đưa vào công việc nhờ tương tác với nhau. Đây là một biểu hiện của văn hóa tổ chức (Schermerhorn).","w":"Huyền thoại khởi nghiệp là câu chuyện về người sáng lập; nghi lễ và biểu tượng là các yếu tố hữu hình của văn hóa."},{"c":2,"n":3,"s":"Đề 1 – câu 3","q":"Theo thuyết tháp nhu cầu của Abraham Maslow, có bao nhiêu cấp độ nhu cầu?","o":["3","2","4","5"],"a":3,"e":"Tháp nhu cầu của Maslow có 5 cấp: sinh lý, an toàn, xã hội, kính trọng, tự thể hiện bản thân.","w":"Thuyết ERG của Alderfer mới gộp thành 3 nhóm nhu cầu (A)."},{"c":2,"n":4,"s":"Đề 1 – câu 4","q":"Trong các yếu tố sau, yếu tố nào được xem là phần thưởng bên ngoài?","o":["Sự công nhận","Sự phát triển","Tiền lương","Trách nhiệm"],"a":2,"e":"Phần thưởng bên ngoài do người khác (tổ chức) trao, như tiền lương, tiền thưởng, phúc lợi. Phần thưởng nội tại đến từ chính công việc: sự phát triển, trách nhiệm, cảm giác thành tựu.","w":"Sự phát triển và trách nhiệm là nội tại. Sự công nhận trong thuyết Herzberg được xếp vào nhóm nhân tố thúc đẩy (nội tại)."},{"c":1,"n":5,"s":"Đề 1 – câu 5","q":"Đâu KHÔNG phải là một giai đoạn trong quá trình nhận thức?","o":["Truy xuất (retrieval)","Chú ý / chọn lọc (attention/selection)","Theo đuổi đến cùng (follow-through)","Diễn giải (interpretation)"],"a":2,"e":"Theo Schermerhorn, quá trình nhận thức gồm: chú ý/chọn lọc → tổ chức → diễn giải → truy xuất.","w":"\"Theo đuổi đến cùng\" (follow-through) không phải một giai đoạn của quá trình nhận thức."},{"c":0,"n":6,"s":"Đề 1 – câu 6","q":"Ngành khoa học nào sau đây kết hợp các khái niệm của tâm lý học và xã hội học, tập trung vào ảnh hưởng của mọi người đối với nhau?","o":["Vũ trụ học","Tâm lý xã hội","Cận tâm lý học","Từ vựng học"],"a":1,"e":"Tâm lý xã hội pha trộn khái niệm của tâm lý học và xã hội học, tập trung vào ảnh hưởng của mọi người đối với nhau.","w":"Vũ trụ học, cận tâm lý học, từ vựng học không phải ngành đóng góp cho OB."},{"c":0,"n":7,"s":"Đề 1 – câu 7","q":"____ là sự không đồng nhất của tổ chức về giới tính, tuổi tác, chủng tộc, dân tộc, xu hướng tính dục và sự hòa nhập của các nhóm đa dạng khác.","o":["Sự tương đồng của tổ chức","Khả năng liên kết của lực lượng lao động","Sự đa dạng của lực lượng lao động (workforce diversity)","Sự tương đồng văn hóa"],"a":2,"e":"Sự đa dạng của lực lượng lao động là sự không đồng nhất của tổ chức về giới tính, tuổi, chủng tộc, dân tộc, xu hướng tính dục và sự hòa nhập của các nhóm đa dạng.","w":"Các phương án khác mang nghĩa đồng nhất, tương đồng, trái với khái niệm."},{"c":3,"n":8,"s":"Đề 1 – câu 8","q":"Hiệu quả của nhóm và quản lý chất lượng đòi hỏi các nhóm .","o":["Được trao quyền giải quyết vấn đề và thực hiện hành động khắc phục","Đủ nhỏ để làm việc có hiệu suất và hiệu quả","Được đào tạo đúng các kỹ năng cần thiết","Tất cả đều đúng"],"a":3,"e":"Để nhóm làm việc hiệu quả và quản lý chất lượng thành công, nhóm cần: được trao quyền giải quyết vấn đề và khắc phục, đủ nhỏ để hiệu quả, và được đào tạo đủ kỹ năng. Vì vậy tất cả đều đúng."},{"c":4,"n":9,"s":"Đề 1 – câu 9","q":"Nhân viên có thể học hỏi văn hóa tổ chức thông qua ____ .","o":["Tất cả đều đúng","Biểu tượng vật chất (material symbols)","Nghi thức (rituals)","Những câu chuyện (stories)"],"a":0,"e":"Theo giáo trình, nhân viên học văn hóa tổ chức qua câu chuyện, nghi thức, biểu tượng vật chất và ngôn ngữ. Vì vậy tất cả đều đúng."},{"c":1,"n":10,"s":"Đề 1 – câu 10","q":"Những năng lực liên quan đến việc tiếp thu và vận dụng kiến thức để giải quyết vấn đề là:","o":["Khả năng lập luận","Khả năng tư duy không gian","Khả năng tri giác","Khả năng nhận thức (cognitive abilities)"],"a":3,"e":"Khả năng nhận thức (cognitive abilities) là những năng lực liên quan đến việc tiếp thu và vận dụng kiến thức để giải quyết vấn đề, như lập luận, nhận thức, trí nhớ.","w":"Khả năng lập luận, tư duy không gian, tri giác chỉ là các thành phần cụ thể của khả năng trí tuệ, không phải khái niệm bao quát."},{"c":1,"n":11,"s":"Đề 1 – câu 11","q":"Mức độ cao của cả tham gia công việc (job involvement) và trao quyền tâm lý (psychological empowerment) có quan hệ thuận với ____ .","o":["Sự bất hòa về nhận thức","Hiệu ứng thiên về tích cực (positivity offset)","Hành vi công dân tổ chức (OCB)","Hành vi rút lui"],"a":2,"e":"Mức độ cao của tham gia công việc và trao quyền tâm lý có quan hệ thuận với hành vi công dân tổ chức (OCB) và hiệu suất công việc.","w":"Hành vi rút lui (vắng mặt, nghỉ việc) có quan hệ nghịch với các thái độ này; bất hòa nhận thức không liên quan."},{"c":0,"n":12,"s":"Đề 1 – câu 12","q":"Hành động nào sau đây là ví dụ về hành vi tiêu cực tại nơi làm việc (deviant workplace behavior)?","o":["Tất cả đều đúng","Về sớm","Cố tình làm việc chậm","Tung tin đồn"],"a":0,"e":"Hành vi tiêu cực tại nơi làm việc là hành vi tự nguyện vi phạm chuẩn mực của tổ chức: về sớm (sản xuất), cố tình làm chậm (sản xuất), tung tin đồn (chính trị, cá nhân). Vì vậy tất cả đều đúng."},{"c":2,"n":13,"s":"Đề 1 – câu 13","q":"Nhu cầu thành tựu (tự thể hiện bản thân) bao gồm ____ .","o":["Thành tích và trách nhiệm","Tất cả đều đúng","Tiền lương và đời sống cá nhân","Điều kiện làm việc"],"a":0,"e":"Nhu cầu bậc cao (thành tựu, tự thể hiện) được đáp ứng bằng các yếu tố nội tại như thành tích và trách nhiệm. Đây cũng là các nhân tố thúc đẩy của Herzberg.","w":"Tiền lương, đời sống cá nhân, điều kiện làm việc đáp ứng nhu cầu bậc thấp (nhân tố duy trì)."},{"c":3,"n":14,"s":"Đề 1 – câu 14","q":"Hạn chế của cách tiếp cận đặc điểm (trait approach) trong lãnh đạo bao gồm:","o":["Không tìm thấy đặc điểm phổ quát nào dự đoán được khả năng lãnh đạo trong mọi tình huống","Bằng chứng chưa rõ ràng về quan hệ nhân quả giữa lãnh đạo và các đặc điểm","Dự đoán tốt hơn sự xuất hiện của nhà lãnh đạo, hơn là phân biệt nhà lãnh đạo hiệu quả với không hiệu quả","Tất cả đều đúng"],"a":3,"e":"Hạn chế của cách tiếp cận đặc điểm: không có đặc điểm phổ quát dự báo lãnh đạo trong mọi tình huống; chưa rõ quan hệ nhân quả giữa đặc điểm và lãnh đạo; dự đoán sự xuất hiện của nhà lãnh đạo tốt hơn là phân biệt nhà lãnh đạo hiệu quả với không hiệu quả. Vì vậy tất cả đều đúng."},{"c":3,"n":15,"s":"Đề 1 – câu 15","q":"Đội làm việc tự quản (self-managing teams) ____ .","o":["Phần lớn loại bỏ nhu cầu có người giám sát truyền thống","Phụ thuộc nhiều vào đào tạo bên ngoài để duy trì kỹ năng","Giảm số lượng nhiệm vụ khác nhau mà thành viên cần thành thạo","Tạo thêm một cấp quản lý, làm tăng chi phí chung"],"a":0,"e":"Đội làm việc tự quản đảm nhận nhiều trách nhiệm của người giám sát trước đây (lập kế hoạch, phân công, kiểm soát), nên phần lớn loại bỏ nhu cầu có người giám sát truyền thống.","w":"Đội tự quản giúp giảm cấp quản lý (D sai) và thành viên thường phải thành thạo nhiều nhiệm vụ hơn (C sai)."},{"c":2,"n":16,"s":"Đề 1 – câu 16","q":"Khía cạnh nào của thiết kế công việc liên quan đến yêu cầu thực hiện các nhiệm vụ khác nhau trong công việc?","o":["Bản sắc nhiệm vụ (task identity)","Ý nghĩa nhiệm vụ (task significance)","Quyền tự chủ (autonomy)","Đa dạng kỹ năng (skill variety)"],"a":3,"e":"Trong mô hình đặc điểm công việc, đa dạng kỹ năng là mức độ công việc đòi hỏi nhiều hoạt động khác nhau, sử dụng nhiều kỹ năng.","w":"Bản sắc nhiệm vụ là hoàn thành trọn vẹn một phần việc; ý nghĩa nhiệm vụ là tác động đến người khác; quyền tự chủ là mức độ tự quyết."},{"c":1,"n":17,"s":"Đề 1 – câu 17","q":"____ là những nhận định mang tính đánh giá về sự vật, con người hoặc sự kiện.","o":["Thái độ","Ngoại hình","Hiệu suất","Hành vi"],"a":0,"e":"Thái độ là những nhận định mang tính đánh giá, thuận lợi hoặc không, về sự vật, con người hay sự kiện.","w":"Hành vi là việc làm cụ thể; hiệu suất là kết quả công việc."},{"c":1,"n":18,"s":"Đề 1 – câu 18","q":"Nhân viên có thể phản ứng với những sự kiện tiêu cực trong công việc theo bốn cách:","o":["Lên tiếng, hài lòng, bỏ mặc và trung thành","Tẩu thoát, lên tiếng, hài lòng và bỏ mặc","Tẩu thoát, lên tiếng, trung thành và bỏ mặc","Lên tiếng, hài lòng, trung thành và bỏ mặc"],"a":2,"e":"Bốn phản ứng trước sự bất mãn: Tẩu thoát (exit), Lên tiếng (voice), Trung thành (loyalty), Bỏ mặc (neglect).","w":"\"Hài lòng\" không phải phản ứng trước sự bất mãn."},{"c":1,"n":19,"s":"Đề 1 – câu 19","q":"Thuật ngữ nào chỉ những yếu tố như cấu tạo sinh học, sinh lý và tâm lý bẩm sinh được xác định từ khi thụ thai?","o":["Sự tự thích ứng (self-concordance)","Di truyền (heredity)","Sự lây lan hành vi","Bản sắc xã hội"],"a":1,"e":"Di truyền (heredity) là những yếu tố được xác định từ khi thụ thai: vóc dáng, ngoại hình, giới tính, khí chất, sinh lý, cấu tạo tâm lý bẩm sinh.","w":"Sự tự thích ứng thuộc lý thuyết động lực; bản sắc xã hội liên quan đến nhóm."},{"c":3,"n":20,"s":"Đề 1 – câu 20","q":"Trong giai đoạn ____ của quá trình phát triển nhóm, các thành viên bắt đầu gắn kết thành một đơn vị phối hợp.","o":["Xung đột (storming)","Chuẩn hóa (norming)","Thực hiện (performing)","Hợp nhất hoàn toàn"],"a":1,"e":"Năm giai đoạn phát triển nhóm: hình thành → xung đột → chuẩn hóa → thực hiện → giải tán. Ở giai đoạn chuẩn hóa (norming), nhóm thống nhất chuẩn mực, vai trò, các thành viên bắt đầu gắn kết thành một đơn vị phối hợp.","w":"Xung đột là giai đoạn mâu thuẫn; thực hiện là khi nhóm đã vận hành đầy đủ để hoàn thành nhiệm vụ."},{"c":1,"n":21,"s":"Đề 1 – câu 21","q":"Theo Daniel Goleman, lý thuyết trí tuệ cảm xúc (EQ) gồm năm thành phần, đó là:","o":["Tự nhận thức, nhận thức người khác, động lực, điều tiết cảm xúc và kỹ năng xã hội","Tự nhận thức, nhận thức người khác, động lực, sự đồng cảm và sử dụng cảm xúc","Tự nhận thức, tự điều chỉnh, động lực, sự đồng cảm và kỹ năng xã hội","Tự nhận thức, nhận thức người khác, điều tiết cảm xúc, tự điều chỉnh và sử dụng cảm xúc"],"a":2,"e":"Mô hình EQ của Daniel Goleman gồm 5 thành phần: tự nhận thức, tự điều chỉnh, động lực, sự đồng cảm và kỹ năng xã hội.","w":"Các phương án khác thay thành phần bằng những khái niệm không có trong mô hình (nhận thức người khác, sử dụng cảm xúc)."},{"c":4,"n":22,"s":"Đề 1 – câu 22","q":"Phát biểu nào sau đây đúng về cơ cấu adhocracy (cơ cấu linh hoạt, phi chính thức theo dự án)?","o":["Việc sử dụng công nghệ thông tin luôn ở mức tối thiểu.","Có nhiều quy tắc và chính sách.","Thiết kế này tạo điều kiện cho trao đổi thông tin và học hỏi.","Xử lý hiệu quả các vấn đề thường lệ."],"a":2,"e":"Adhocracy là cơ cấu linh hoạt, ít chính thức hóa, thường tổ chức theo dự án, phù hợp với đổi mới: thiết kế này tạo điều kiện trao đổi thông tin và học hỏi.","w":"Nhiều quy tắc và xử lý vấn đề thường lệ hiệu quả là đặc điểm của cơ cấu quan liêu; adhocracy thường sử dụng nhiều công nghệ thông tin."},{"c":2,"n":23,"s":"Đề 1 – câu 23","q":"Theo thuyết hai nhân tố của Herzberg, yếu tố nào sau đây là nhân tố duy trì?","o":["Sự công nhận","Điều kiện làm việc","Trách nhiệm","Thành tựu"],"a":1,"e":"Theo Herzberg, nhân tố duy trì là yếu tố bên ngoài, thuộc bối cảnh công việc: điều kiện làm việc, lương, chính sách công ty, giám sát, quan hệ đồng nghiệp.","w":"Sự công nhận, trách nhiệm, thành tựu là nhân tố thúc đẩy."},{"c":2,"n":24,"s":"Đề 1 – câu 24","q":"Loại mục tiêu nào có xu hướng tạo động lực nhiều hơn?","o":["Mục tiêu chung chung","Mục tiêu dễ","Mục tiêu thách thức","Không có mục tiêu"],"a":2,"e":"Theo lý thuyết thiết lập mục tiêu, mục tiêu cụ thể và thách thức (nhưng được chấp nhận) tạo ra hiệu suất cao hơn mục tiêu chung chung, mục tiêu dễ hoặc không có mục tiêu."},{"c":3,"n":25,"s":"Đề 1 – câu 25","q":"Quy mô tốt nhất cho một nhóm giải quyết vấn đề thường là thành viên.","o":["Khoảng 12 đến 13","8 đến 10","5 đến 7","Không quá 3 hoặc 4"],"a":2,"e":"Nhóm giải quyết vấn đề hiệu quả nhất thường có 5 đến 7 thành viên: đủ người để đa dạng ý kiến nhưng không quá đông, tránh khó phối hợp và ỷ lại (social loafing).","w":"Nhóm quá lớn (A, B) dễ phát sinh ỷ lại; nhóm quá nhỏ (D) thiếu đa dạng kỹ năng và quan điểm."},{"c":2,"n":26,"s":"Đề 1 – câu 26","q":"Trong thuyết ERG của Alderfer, nhu cầu ____ tương ứng nhất với các nhu cầu bậc cao về kính trọng và tự thể hiện bản thân của Maslow.","o":["Quan hệ (relatedness)","Công nhận","Phát triển (growth)","Tồn tại (existence)"],"a":2,"e":"Thuyết ERG: Tồn tại tương ứng với sinh lý và an toàn; Quan hệ tương ứng với xã hội và một phần kính trọng (được người khác tôn trọng); Phát triển tương ứng với kính trọng (tự trọng) và tự thể hiện.","w":"\"Công nhận\" không phải nhóm nhu cầu trong ERG."},{"c":3,"n":27,"s":"Đề 1 – câu 27","q":"Cách tiếp cận đặc điểm trong các lý thuyết lãnh đạo tập trung vào:","o":["Hành vi của nhà lãnh đạo","Các đặc điểm về tính cách, xã hội, thể chất hoặc trí tuệ giúp phân biệt nhà lãnh đạo với người không phải lãnh đạo","Các yếu tố môi trường ảnh hưởng đến hiệu quả lãnh đạo","Tất cả đều đúng"],"a":1,"e":"Cách tiếp cận đặc điểm tìm các đặc điểm tính cách, xã hội, thể chất hoặc trí tuệ giúp phân biệt nhà lãnh đạo với người không phải lãnh đạo.","w":"A là cách tiếp cận hành vi; C là cách tiếp cận tình huống."},{"c":1,"n":28,"s":"Đề 1 – câu 28","q":"Phát biểu nào sau đây thể hiện thành phần nhận thức của thái độ?","o":["Tôi định làm việc vào cuối tuần để kịp hạn chót của tháng.","Công việc này không cho tôi cơ hội khám phá kỹ năng của mình.","Tôi thấy bực bội vì phải làm việc vào cuối tuần.","Tôi đã định báo với cấp trên rằng tôi sẽ nghỉ việc."],"a":1,"e":"Thành phần nhận thức là niềm tin, nhận định: \"Công việc này không cho tôi cơ hội khám phá kỹ năng\" là một nhận định đánh giá.","w":"C là cảm xúc (bực bội); A, D là ý định hành động (thành phần hành vi)."},{"c":0,"n":29,"s":"Đề 1 – câu 29","q":"Phát biểu nào về hành vi tổ chức (OB) là đúng nhất?","o":["OB là một ngành khoa học độc lập, ít liên quan đến các ngành khoa học khác.","OB tìm kiếm giải pháp \"một cách tốt nhất\" cho các vấn đề quản trị.","OB hiện đại đến mức không có nguồn gốc lịch sử.","OB tập trung vào việc sử dụng kiến thức cho các ứng dụng thực tiễn."],"a":3,"e":"OB là khoa học ứng dụng, tập trung vào việc sử dụng kiến thức cho các ứng dụng thực tiễn nhằm nâng cao hiệu quả tổ chức.","w":"OB đa ngành (A sai), mang tính tùy thuộc, không có \"một cách tốt nhất\" (B sai), và có nguồn gốc lịch sử lâu dài (C sai)."},{"c":0,"n":30,"s":"Đề 1 – câu 30","q":"____ là ngành tìm cách đo lường, giải thích và đôi khi thay đổi hành vi của con người và các động vật khác.","o":["Thần học","Khí tượng học","Nhận thức luận","Tâm lý học"],"a":3,"e":"Tâm lý học là ngành tìm cách đo lường, giải thích và đôi khi thay đổi hành vi của con người và các động vật khác.","w":"Thần học, khí tượng học, nhận thức luận không phải ngành khoa học hành vi. BỘ ĐỀ LMS"},{"c":1,"n":31,"s":"Đề 2 – câu 1","q":"Phát biểu nào sau đây thể hiện thành phần cảm xúc của thái độ?","o":["Cảm thấy tổn thương vì bị buộc tội oan về một hành vi sai trái.","Nhận định việc tố giác sai phạm (thổi còi) là điều đúng đắn.","Tin rằng mình đã đạt được mọi mục tiêu của dự án.","Dựa vào thông tin trong báo cáo thường niên của công ty."],"a":0,"e":"Thành phần cảm xúc là cảm giác, cảm nhận: \"cảm thấy tổn thương\" vì bị buộc tội oan.","w":"B, C là niềm tin hoặc nhận định (thành phần nhận thức); D là việc dựa vào thông tin."},{"c":0,"n":32,"s":"Đề 2 – câu 2","q":"____ hoàn thành công việc thông qua người khác. Họ đưa ra quyết định, phân bổ nguồn lực và điều hướng hoạt động của người khác để đạt được mục tiêu.","o":["Thư ký","Trợ lý","Thực tập sinh","Nhà quản lý"],"a":3,"e":"Nhà quản lý hoàn thành công việc thông qua người khác: ra quyết định, phân bổ nguồn lực và điều hướng hoạt động của người khác để đạt mục tiêu.","w":"Thư ký, trợ lý, thực tập sinh thực hiện nhiệm vụ của bản thân, không điều hành người khác."},{"c":2,"n":33,"s":"Đề 2 – câu 3","q":"Trong mô hình đặc điểm công việc (JCM), một người nhiều khả năng thấy công việc được làm giàu có tính thúc đẩy nếu họ ____ .","o":["Được nhận quyền chọn mua cổ phiếu","Có năng lực và được hỗ trợ","Không hài lòng với bối cảnh công việc","Có nhu cầu phát triển mạnh"],"a":3,"e":"Mô hình đặc điểm công việc cho thấy sức mạnh của nhu cầu phát triển điều tiết mối quan hệ: người có nhu cầu phát triển mạnh phản ứng tích cực hơn với công việc được làm giàu.","w":"Năng lực và sự hỗ trợ (B) giúp thực hiện công việc nhưng không phải biến điều tiết của mô hình; quyền chọn cổ phiếu là phần thưởng bên ngoài."},{"c":4,"n":34,"s":"Đề 2 – câu 4","q":"Văn hóa liên quan đến tất cả những điều sau, NGOẠI TRỪ .","o":["Niềm tin của các thành viên","Các quan niệm chung được các thành viên trong công ty chia sẻ","Tính cách của nhà lãnh đạo","Những năng lực được tiếp thu"],"a":2,"e":"Văn hóa tổ chức là các quan niệm, niềm tin chung được thành viên chia sẻ và những năng lực được tiếp thu qua quá trình học hỏi.","w":"Tính cách của nhà lãnh đạo là đặc điểm cá nhân. Nó có thể ảnh hưởng đến văn hóa nhưng không phải bản thân văn hóa."},{"c":3,"n":35,"s":"Đề 2 – câu 5","q":"Các cách làm tăng sự gắn kết của nhóm (cohesiveness) gồm:","o":["Dành nhiều thời gian bên nhau hơn","Tất cả đều đúng","Tách biệt nhóm về mặt vật lý","Khen thưởng cho cả nhóm thay vì từng cá nhân"],"a":1,"e":"Các cách tăng sự gắn kết nhóm: dành nhiều thời gian bên nhau, tách biệt nhóm về mặt vật lý, khen thưởng cho cả nhóm, làm nhóm nhỏ lại, khuyến khích đồng thuận về mục tiêu… Vì vậy tất cả đều đúng."},{"c":4,"n":36,"s":"Đề 2 – câu 6","q":"Chiến lược của một công ty ____ .","o":["Chỉ là một khuôn mẫu trong chuỗi các quyết định","Là quá trình tiếp thu kiến thức, lưu giữ trong tổ chức, phân phối và diễn giải thông tin","Là quá trình định vị tổ chức trong môi trường cạnh tranh và triển khai các hành động để cạnh tranh thành công; đó là một khuôn mẫu trong chuỗi các quyết định","Chỉ là quá trình định vị tổ chức để cạnh tranh"],"a":2,"e":"Chiến lược là quá trình định vị tổ chức trong môi trường cạnh tranh và triển khai hành động để cạnh tranh thành công. Nó cũng là một khuôn mẫu trong chuỗi các quyết định. C là định nghĩa đầy đủ nhất.","w":"A, D chỉ nêu một nửa định nghĩa; B là định nghĩa của học tập tổ chức (organizational learning)."},{"c":0,"n":37,"s":"Đề 2 – câu 7","q":"Phân tích các mối quan hệ, xác định nguyên nhân – kết quả và đưa ra kết luận dựa trên bằng chứng khoa học đều là những khía cạnh của nghiên cứu .","o":["Tổ chức","Trực giác","Lý thuyết","Có hệ thống"],"a":3,"e":"Phân tích quan hệ, xác định nhân quả, kết luận dựa trên bằng chứng khoa học là định nghĩa của nghiên cứu có hệ thống.","w":"Trực giác dựa trên cảm giác, không dựa trên bằng chứng khoa học."},{"c":4,"n":38,"s":"Đề 2 – câu 8","q":"Khi công nhân Nhật Bản bắt đầu mỗi ngày làm việc bằng bài hát của công ty, đây là ví dụ về ____ .","o":["Giả định ngầm","Huyền thoại","Nghi thức (ritual)","Biểu tượng"],"a":2,"e":"Hát bài hát công ty mỗi sáng là hoạt động lặp lại, mang tính biểu trưng cho giá trị chung, tức là một nghi thức (ritual).","w":"Huyền thoại là câu chuyện; biểu tượng là vật hữu hình (logo, trang phục); giả định ngầm là tầng sâu nhất, vô hình của văn hóa."},{"c":2,"n":39,"s":"Đề 2 – câu 9","q":"Trạng thái tâm lý quan trọng tương ứng với khía cạnh quyền tự chủ (autonomy) là gì?","o":["Sự hài lòng công việc","Cảm nhận ý nghĩa của công việc","Hiểu biết về kết quả thực tế của các hoạt động công việc","Cảm nhận trách nhiệm đối với kết quả công việc"],"a":3,"e":"Trong mô hình JCM: đa dạng kỹ năng, bản sắc và ý nghĩa nhiệm vụ dẫn đến cảm nhận ý nghĩa của công việc; quyền tự chủ dẫn đến cảm nhận trách nhiệm đối với kết quả; phản hồi dẫn đến hiểu biết về kết quả thực tế.","w":"B tương ứng với ba khía cạnh đầu; C tương ứng với phản hồi."},{"c":2,"n":40,"s":"Đề 2 – câu 13","q":"Trong thuyết công bằng, ____ là vấn đề then chốt.","o":["Sự bình đẳng về phần thưởng","Sự bình đẳng về nỗ lực","Sự so sánh xã hội về phần thưởng và nỗ lực","Giá trị tuyệt đối của phần thưởng"],"a":2,"e":"Cốt lõi của thuyết công bằng là so sánh xã hội: nhân viên so sánh tỷ lệ phần thưởng/nỗ lực (kết quả/đầu vào) của mình với người khác.","w":"Công bằng không có nghĩa là bình đẳng tuyệt đối về phần thưởng hay nỗ lực (A, B); giá trị tuyệt đối của phần thưởng (D) không quan trọng bằng giá trị tương đối."},{"c":0,"n":41,"s":"Đề 2 – câu 14","q":"____ là lĩnh vực nghiên cứu tác động của cá nhân, nhóm và cơ cấu đến hành vi trong tổ chức, nhằm ứng dụng kiến thức đó vào việc nâng cao hiệu quả của tổ chức.","o":["Phát triển tổ chức","Hành vi tổ chức","Quản trị nguồn nhân lực","Chiến lược doanh nghiệp"],"a":1,"e":"Đây là định nghĩa Hành vi tổ chức của Robbins & Judge: nghiên cứu tác động của cá nhân, nhóm và cơ cấu đến hành vi trong tổ chức, nhằm nâng cao hiệu quả tổ chức.","w":"Phát triển tổ chức là phương pháp thay đổi tổ chức; quản trị nguồn nhân lực là chức năng quản lý."},{"c":0,"n":42,"s":"Đề 2 – câu 15","q":"Trong mô hình OB cơ bản, ____ được xác định trước khi có quan hệ lao động, gồm các biến như tính cách, cơ cấu nhóm và văn hóa tổ chức, và dẫn đến các quá trình.","o":["Đầu vào (inputs)","Quá trình (processes)","Kết quả (outcomes)","Hành động"],"a":0,"e":"Mô hình OB cơ bản gồm đầu vào → quá trình → kết quả. Đầu vào (tính cách, giá trị, cơ cấu nhóm, văn hóa tổ chức) được xác định trước khi có quan hệ lao động và dẫn đến các quá trình.","w":"Quá trình là hành động diễn ra (giao tiếp, ra quyết định); kết quả là biến được giải thích (năng suất, sự hài lòng)."},{"c":3,"n":43,"s":"Đề 2 – câu 16","q":"Giai đoạn đầu tiên trong quá trình phát triển nhóm là:","o":["Giai đoạn xung đột (Storming)","Giai đoạn hình thành (Forming)","Giai đoạn thực hiện (Performing)","Giai đoạn chuẩn hóa (Norming)"],"a":1,"e":"Giai đoạn đầu tiên là hình thành (forming): các thành viên làm quen, chưa chắc chắn về mục đích, cơ cấu và lãnh đạo của nhóm.","w":"Trình tự là hình thành → xung đột → chuẩn hóa → thực hiện."},{"c":1,"n":44,"s":"Đề 2 – câu 17","q":"Khuôn mẫu (stereotyping) xảy ra khi ta nghĩ về một cá nhân .","o":["Về cơ bản là người không có nhiều năng lực","Là người mang những đặc điểm thường gắn với các thành viên của một nhóm nhất định","Là người khác biệt với những người khác trong một nhóm nhất định","Là người giống một số thành viên của nhóm nhưng khác những người còn lại"],"a":1,"e":"Khuôn mẫu xảy ra khi ta cho rằng một người mang những đặc điểm thường gắn với nhóm mà người đó thuộc về.","w":"A là định kiến tiêu cực cụ thể; C, D mô tả sự khác biệt so với nhóm, ngược với khuôn mẫu."},{"c":1,"n":45,"s":"Đề 2 – câu 18","q":"Mô hình Big Five gồm ____ .","o":["Năm đặc điểm nhân khẩu học","Năm năng khiếu và khả năng","Hướng ngoại, thỏa thuận, lương tâm, tính ổn định về cảm xúc và sự cởi mở với trải nghiệm","Hướng ngoại, thỏa thuận, sức mạnh, tính ổn định về cảm xúc và sự cởi mở với trải nghiệm"],"a":2,"e":"Big Five gồm: Hướng ngoại, Thỏa thuận, Lương tâm, Tính ổn định về cảm xúc, Sự cởi mở với trải nghiệm.","w":"D thay \"lương tâm\" bằng \"sức mạnh\"; A, B không phải đặc điểm tính cách."},{"c":2,"n":46,"s":"Đề 2 – câu 19","q":"\"4/40\" là một kiểu sắp xếp công việc ____ .","o":["Bán thời gian cố định","Cho phép công nhân thay đổi cấu hình máy để làm ra các sản phẩm khác nhau","Chia sẻ công việc (job sharing)","Tuần làm việc nén (compressed workweek)"],"a":3,"e":"\"4/40\" nghĩa là làm 40 giờ trong 4 ngày (10 giờ/ngày), một dạng tuần làm việc nén (compressed workweek).","w":"Chia sẻ công việc là hai người cùng đảm nhận một công việc; bán thời gian là làm ít giờ hơn."},{"c":1,"n":47,"s":"Đề 2 – câu 20","q":"Cam kết tình cảm (affective commitment) xảy ra khi:","o":["Nhân viên cảm thấy mình nên ở lại, chịu ảnh hưởng bởi việc tổ chức đầu tư vào nhân viên hoặc tham gia các hoạt động từ thiện","Nhân viên muốn ở lại, chịu ảnh hưởng bởi sự gắn bó tình cảm giữa các nhân viên","Nhân viên cần ở lại, chịu ảnh hưởng bởi tiền lương và phúc lợi","Là mong muốn của nhân viên được tiếp tục là thành viên của tổ chức"],"a":1,"e":"Theo Colquitt/Schermerhorn, cam kết với tổ chức có ba dạng: Tình cảm (affective): nhân viên muốn ở lại, do gắn bó tình cảm. Liên tục (continuance): nhân viên cần ở lại, do chi phí khi rời đi (lương, phúc lợi). Quy tắc (normative): nhân viên cảm thấy nên ở lại, do nghĩa vụ đạo đức.","w":"A là cam kết quy tắc; C là cam kết liên tục; D là định nghĩa chung của sự cam kết với tổ chức."},{"c":4,"n":48,"s":"Đề 2 – câu 21","q":"Những khuôn mẫu giá trị và triết lý công khai bác bỏ giá trị và triết lý của tổ chức hay hệ thống xã hội lớn hơn được gọi là ____ .","o":["Truyền thuyết (sagas)","Phát triển tổ chức","Nghi thức","Phản văn hóa (countercultures)"],"a":3,"e":"Phản văn hóa (countercultures) là khuôn mẫu giá trị và triết lý công khai bác bỏ giá trị của tổ chức hay hệ thống xã hội lớn hơn.","w":"Truyền thuyết (saga) là câu chuyện lịch sử được tôn vinh; nghi thức là hoạt động lặp lại."},{"c":2,"n":49,"s":"Đề 2 – câu 22","q":"Mục đích của củng cố tiêu cực (negative reinforcement) với tư cách là một kỹ thuật điều hòa hoạt động (operant conditioning) là ____ .","o":["Bù trừ tác động của việc định hình hành vi (shaping)","Ngăn chặn hành vi xấu","Khuyến khích hành vi mong muốn","Trừng phạt hành vi xấu"],"a":2,"e":"Củng cố tiêu cực là loại bỏ một hệ quả khó chịu khi hành vi mong muốn xảy ra, nhằm khuyến khích hành vi mong muốn (làm tăng khả năng hành vi lặp lại).","w":"B, D là mục đích của hình phạt, không phải củng cố tiêu cực. Đây là chỗ hay bị nhầm."},{"c":3,"n":50,"s":"Đề 2 – câu 23","q":"Đặc điểm nhiệm vụ, hệ thống khen thưởng và quy mô nhóm đều là có thể tạo ra sự khác biệt trong hiệu quả của nhóm.","o":["Động lực học nhóm (group dynamics)","Các yếu tố duy trì nguồn nhân lực","Các quá trình nhóm","Các đầu vào của nhóm"],"a":3,"e":"Mô hình hiệu quả nhóm: đầu vào (đặc điểm nhiệm vụ, hệ thống khen thưởng, quy mô nhóm, thành phần thành viên) → quá trình nhóm → kết quả.","w":"Quá trình nhóm là chuẩn mực, vai trò, giao tiếp, ra quyết định; động lực học nhóm là cách các thành viên tương tác với nhau."},{"c":2,"n":51,"s":"Đề 2 – câu 24","q":"Trong chương trình Quản lí bằng mục tiêu (MBO), quyết định về mục tiêu phải:","o":["Tất cả đều đúng","Được nhà quản lý và nhân viên thống nhất","Được xác định rõ ràng ngay từ đầu quá trình làm việc","Minh bạch và dễ hiểu"],"a":0,"e":"Trong MBO, mục tiêu phải được cấp trên và nhân viên cùng thống nhất, xác định rõ từ đầu (khoảng thời gian rõ ràng) và minh bạch, dễ hiểu, đo lường được. Vì vậy tất cả đều đúng."},{"c":1,"n":52,"s":"Đề 2 – câu 25","q":"Shara thất vọng vì không được chọn vào chương trình học bổng của trường đại học. Cảm giác của Shara thể hiện thành phần nào của thái độ?","o":["Phản tư","Nhận thức (cognitive)","Cảm xúc (affective)","Hành vi (behavioural)"],"a":2,"e":"\"Thất vọng\" là cảm xúc, thuộc thành phần cảm xúc (affective) của thái độ.","w":"Nhận thức là niềm tin; hành vi là ý định hành động; \"phản tư\" không phải thành phần của thái độ."},{"c":0,"n":53,"s":"Đề 2 – câu 26","q":"Trong 10 vai trò quản trị của Mintzberg, vai trò đại diện (figurehead) và liên lạc (liaison) là ví dụ về vai trò ____ .","o":["Tư duy","Quan hệ với con người (interpersonal)","Thông tin","Quyết định"],"a":1,"e":"Vai trò đại diện và liên lạc (cùng vai trò lãnh đạo) thuộc nhóm vai trò quan hệ với con người (interpersonal) theo Mintzberg.","w":"Vai trò thông tin gồm thu thập, phổ biến, phát ngôn; vai trò quyết định gồm doanh nhân, giải quyết xáo trộn, phân phối tài nguyên, đàm phán."},{"c":0,"n":54,"s":"Đề 2 – câu 27","q":"Điều nào sau đây là kết quả của toàn cầu hóa?","o":["Lực lượng lao động có tính đồng nhất cao","Việc làm dịch chuyển sang các quốc gia có chi phí lao động thấp","Tổ chức bị giới hạn trong biên giới quốc gia","Sản lượng hàng hóa ở các nước đang phát triển giảm"],"a":1,"e":"Một kết quả của toàn cầu hóa là việc làm dịch chuyển sang các quốc gia có chi phí lao động thấp.","w":"Toàn cầu hóa làm lực lượng lao động đa dạng hơn (A sai) và tổ chức vượt ra ngoài biên giới quốc gia (C sai)."},{"c":2,"n":55,"s":"Đề 2 – câu 28","q":"Theo thuyết hai nhân tố của Herzberg, sự hài lòng công việc nhiều khả năng được cải thiện nhất khi ____ được cải thiện.","o":["Lương cơ bản","Cơ hội nhận trách nhiệm","Điều kiện làm việc","Quan hệ đồng nghiệp"],"a":1,"e":"Theo Herzberg, sự hài lòng chỉ tăng khi cải thiện nhân tố thúc đẩy như cơ hội nhận trách nhiệm, thành tựu, công nhận, phát triển.","w":"Lương cơ bản, điều kiện làm việc, quan hệ đồng nghiệp là nhân tố duy trì: cải thiện chúng chỉ làm giảm bất mãn, không tạo ra sự hài lòng."},{"c":1,"n":56,"s":"Đề 2 – câu 29","q":"Giá trị (values) ____ .","o":["Được dùng thay cho năng lực","Tương tự các biến tính cách","Tương tự thái độ","Liên quan đến năng khiếu"],"a":2,"e":"Giá trị và thái độ có liên hệ chặt chẽ: cả hai đều là những đánh giá mang tính cá nhân, nhưng giá trị bao quát và bền vững hơn, còn thái độ cụ thể hơn và chịu ảnh hưởng của giá trị. Trong các phương án, \"tương tự thái độ\" sát với mô tả của giáo trình nhất.","l":"Một số tài liệu mô tả giá trị là \"tương đối ổn định giống như tính cách\", nên B cũng có thể được chấp nhận. Giá trị không thay thế năng lực (A) và không phải năng khiếu (D).","i":1},{"c":2,"n":57,"s":"Đề 2 – câu 30","q":"Nhu cầu quan hệ (need for affiliation) bao gồm ____ .","o":["Thành tích và trách nhiệm","Mối quan hệ giữa các cá nhân","Điều kiện làm việc","Tất cả đều đúng"],"a":1,"e":"Nhu cầu quan hệ (nAff) của McClelland là mong muốn có mối quan hệ cá nhân thân thiện và gần gũi.","w":"Thành tích và trách nhiệm thuộc nhu cầu thành tựu; điều kiện làm việc là nhân tố duy trì. PHẦN BỔ SUNG"},{"c":0,"n":58,"s":"Bổ sung – câu 1","q":"____ là cảm giác ruột (gut feeling), không nhất thiết được nghiên cứu chứng minh.","o":["Tính hợp lý","Lập luận","Logic","Trực giác (intuition)"],"a":3,"e":"Trực giác (intuition) là \"cảm giác ruột\", tức là cảm nhận không nhất thiết được nghiên cứu chứng minh.","w":"Tính hợp lý, lập luận, logic đều dựa trên phân tích có cơ sở."},{"c":2,"n":59,"s":"Bổ sung – câu 2","q":"Loại thiết kế công việc nào liên quan đến việc mở rộng công việc theo chiều ngang?","o":["Hoàn thành công việc","Luân chuyển công việc (job rotation)","Mở rộng công việc (job enlargement)","Làm giàu công việc (job enrichment)"],"a":2,"e":"Mở rộng công việc (job enlargement) là mở rộng theo chiều ngang: tăng số lượng và sự đa dạng của nhiệm vụ cùng cấp độ.","w":"Làm giàu công việc là mở rộng theo chiều dọc (thêm trách nhiệm, quyền kiểm soát); luân chuyển là chuyển định kỳ giữa các nhiệm vụ."},{"c":3,"n":60,"s":"Bổ sung – câu 3","q":"Một nhóm hiệu quả được định nghĩa là nhóm đạt mức cao về kết quả thực hiện nhiệm vụ, sự hài lòng của thành viên và ____ .","o":["Sự hòa hợp","Sự sáng tạo","Sự phối hợp","Khả năng tồn tại của nhóm (team viability)"],"a":3,"e":"Nhóm hiệu quả đạt ba tiêu chí: kết quả thực hiện nhiệm vụ, sự hài lòng của thành viên và khả năng tồn tại của nhóm (team viability), tức là khả năng tiếp tục làm việc cùng nhau trong tương lai.","w":"Hòa hợp, sáng tạo, phối hợp là yếu tố hỗ trợ, không phải tiêu chí định nghĩa."},{"c":1,"n":61,"s":"Bổ sung – câu 4","q":"____ là mức độ nhân viên tin rằng tổ chức đánh giá cao sự đóng góp của họ và quan tâm đến hạnh phúc của họ.","o":["Trao quyền tâm lý","Sự tham gia của người lao động (employee engagement)","Hỗ trợ từ tổ chức được nhân viên nhận thức (POS)","Sự cam kết với tổ chức"],"a":2,"e":"Hỗ trợ từ tổ chức được nhân viên nhận thức (POS) là mức độ nhân viên tin rằng tổ chức coi trọng đóng góp và quan tâm đến hạnh phúc của họ.","w":"Trao quyền tâm lý là niềm tin về ảnh hưởng, năng lực, ý nghĩa, tự chủ; cam kết là sự gắn bó với tổ chức."},{"c":2,"n":62,"s":"Bổ sung – câu 5","q":"Khía cạnh nào của thiết kế công việc liên quan đến việc hoàn thành trọn vẹn một phần công việc?","o":["Đa dạng kỹ năng (skill variety)","Ý nghĩa nhiệm vụ (task significance)","Quyền tự chủ (autonomy)","Bản sắc nhiệm vụ (task identity)"],"a":3,"e":"Bản sắc nhiệm vụ (task identity) là mức độ công việc yêu cầu hoàn thành trọn vẹn một phần công việc có thể nhận diện được, từ đầu đến cuối.","w":"Đa dạng kỹ năng là nhiều hoạt động; ý nghĩa nhiệm vụ là tác động đến người khác; tự chủ là quyền tự quyết."},{"c":0,"n":63,"s":"Bổ sung – câu 6","q":"____ là ngành nghiên cứu các xã hội để tìm hiểu về con người và các hoạt động của họ.","o":["Nhận thức luận","Nghĩa vụ luận","Nhân chủng học","Khoa học về sự thiếu hiểu biết (agnotology)"],"a":2,"e":"Nhân chủng học nghiên cứu các xã hội để tìm hiểu về con người và hoạt động của họ. Ngành này đóng góp cho OB về văn hóa tổ chức và phân tích đa văn hóa.","w":"Nhận thức luận, nghĩa vụ luận thuộc triết học; agnotology nghiên cứu về sự thiếu hiểu biết."},{"c":0,"n":64,"s":"Bổ sung – câu 7","q":"Nhà quản lý thực hiện công việc nào sau đây trong chức năng hoạch định?","o":["Thực thi kế hoạch để kết hợp các hoạt động","Xác định mục tiêu của tổ chức","Triển khai chiến lược để đạt được mục tiêu","Hoàn thành mục tiêu của một dự án"],"a":1,"e":"Hoạch định gồm xác định mục tiêu của tổ chức, thiết lập chiến lược tổng thể và xây dựng hệ thống kế hoạch.","w":"A, C là thực thi, triển khai (gần với chức năng tổ chức, lãnh đạo); D là hoàn thành mục tiêu, không phải hoạch định."},{"c":1,"n":65,"s":"Bổ sung – câu 8","q":"Sự không tương thích giữa hai hay nhiều thái độ, hoặc giữa hành vi và thái độ, dẫn đến ____ .","o":["Sự bất hòa trong tổ chức","Hiệu ứng thiên về tích cực (positivity offset)","Cam kết tình cảm","Sự bất hòa về nhận thức (cognitive dissonance)"],"a":3,"e":"Sự không tương thích giữa hai hay nhiều thái độ, hoặc giữa hành vi và thái độ, dẫn đến sự bất hòa về nhận thức (Festinger).","w":"\"Bất hòa trong tổ chức\" không phải thuật ngữ trong giáo trình; cam kết tình cảm là sự gắn bó với tổ chức."},{"c":2,"n":66,"s":"Bổ sung – câu 9","q":"Theo Thuyết X và Thuyết Y của McGregor, đặc điểm nào sau đây thuộc về người theo Thuyết Y?","o":["Không thích làm việc","Né tránh trách nhiệm","Tự định hướng bản thân","Ít tham vọng"],"a":2,"e":"Thuyết Y giả định con người tự định hướng, tự kiểm soát, coi làm việc là tự nhiên và chấp nhận trách nhiệm.","w":"A, B, D là giả định của Thuyết X."},{"c":3,"n":67,"s":"Bổ sung – câu 10","q":"Khi một nhóm có thể đạt được nhiều hơn so với tổng kết quả các thành viên làm việc riêng lẻ, điều này được gọi là ____ .","o":["Sức mạnh tổng hợp (synergy)","Khả năng tồn tại của nhóm (team viability)","Sự đồng thuận","Lãnh đạo phân tán"],"a":0,"e":"Sức mạnh tổng hợp (synergy): nhóm đạt được nhiều hơn tổng kết quả của các thành viên làm việc riêng lẻ (\"1 + 1 > 2\").","w":"Khả năng tồn tại của nhóm là khả năng tiếp tục làm việc cùng nhau; đồng thuận là sự thống nhất ý kiến."},{"c":0,"n":68,"s":"Bổ sung – câu 11","q":"Theo Henry Mintzberg, một quản đốc nhà máy dẫn một nhóm học sinh trung học đi tham quan nhà máy đang thực hiện vai trò ____ .","o":["Người phân phối tài nguyên","Người đại diện (figurehead)","Người lãnh đạo","Người đàm phán"],"a":1,"e":"Dẫn học sinh tham quan nhà máy là hoạt động mang tính nghi lễ, đại diện cho tổ chức. Đây là vai trò đại diện (figurehead) trong nhóm vai trò quan hệ với con người.","w":"Phân phối tài nguyên và đàm phán là vai trò quyết định; lãnh đạo là động viên, chỉ đạo nhân viên.","l":"Ghi chú \"bù nhìn\" trong tài liệu gốc là dịch sai; theo bài giảng, figurehead là \"Đại diện\"."},{"c":4,"n":69,"s":"Bổ sung – câu 12","q":"____ liên kết các vấn đề then chốt về mục tiêu với các vấn đề then chốt về hợp tác, nhằm đưa ra những cách thức chung để công ty quản lý hoạt động của mình.","o":["Triết lý quản lý (managerial philosophy)","Truyền thuyết (saga)","Biểu tượng văn hóa","Nghi thức"],"a":0,"e":"Triết lý quản lý (managerial philosophy) liên kết các vấn đề then chốt về mục tiêu với các vấn đề then chốt về hợp tác, tạo ra những cách thức chung để công ty quản lý hoạt động của mình (Schermerhorn).","w":"Truyền thuyết là câu chuyện lịch sử; biểu tượng và nghi thức là yếu tố hữu hình của văn hóa."},{"c":0,"n":70,"s":"Bổ sung – câu 13","q":"____ là việc đưa ra quyết định quản lý dựa trên bằng chứng khoa học tốt nhất hiện có.","o":["Quản lý khẩn cấp","Quản lý dựa trên bằng chứng (EBM)","Quản lý tài sản","Quản lý tri thức cá nhân"],"a":1,"e":"Quản lý dựa trên bằng chứng (EBM) là đưa ra quyết định quản lý dựa trên bằng chứng khoa học tốt nhất hiện có.","w":"Các hình thức quản lý khác không phải thuật ngữ trong giáo trình."},{"c":0,"n":71,"s":"Bổ sung – câu 14","q":"Theo quan điểm hệ thống mở về tổ chức, những yếu tố như công nghệ, thông tin và tiền được xem là ____ .","o":["Đầu ra","Phản hồi","Yếu tố chuyển đổi","Đầu vào"],"a":3,"e":"Theo quan điểm hệ thống mở, tổ chức nhận đầu vào từ môi trường (con người, công nghệ, thông tin, tiền, nguyên liệu), chuyển đổi chúng thành đầu ra (sản phẩm, dịch vụ) và nhận phản hồi.","w":"Công nghệ, thông tin, tiền là nguồn lực đi vào hệ thống, không phải đầu ra hay quá trình chuyển đổi."},{"c":0,"n":72,"s":"Bổ sung – câu 15","q":"Lĩnh vực nghiên cứu nào sau đây nhiều khả năng liên quan đến việc nghiên cứu văn hóa tổ chức, lý thuyết tổ chức chính thức và cơ cấu tổ chức nhất?","o":["Nghĩa vụ luận","Nhận thức luận","Xã hội học","Khoa học về sự thiếu hiểu biết (agnotology)"],"a":2,"e":"Xã hội học đóng góp cho OB về văn hóa tổ chức, lý thuyết tổ chức chính thức và cơ cấu tổ chức, động lực nhóm, quyền lực, xung đột.","w":"Các phương án khác là các ngành triết học hoặc nhận thức, không đóng góp trực tiếp cho OB."},{"c":1,"n":73,"s":"Bổ sung – câu 16","q":"Mối quan hệ giữa sự hài lòng công việc và hiệu suất công việc là gì?","o":["Quan hệ thuận","Quan hệ không ổn định","Quan hệ nghịch","Không có quan hệ"],"a":0,"e":"Giáo trình kết luận người lao động hài lòng thường làm việc hiệu quả hơn, tức là có mối quan hệ thuận, dù tương quan chỉ ở mức trung bình và có thể diễn ra theo hai chiều.","l":"Một số tài liệu nhấn mạnh mối quan hệ \"không đơn giản\", nhưng đáp án chuẩn theo Robbins là quan hệ thuận.","i":1},{"c":0,"n":74,"s":"Bổ sung – câu 17","q":"Những nhà quản lý giám sát việc chuyển việc làm sang các quốc gia có chi phí lao động thấp nhiều khả năng sẽ ____ .","o":["Quản lý lực lượng lao động đồng nhất về văn hóa","Vấp phải sự phản đối từ các nhóm người lao động","Cung cấp dịch vụ khách hàng kém","Hoạt động trong thị trường ngách"],"a":1,"e":"Giáo trình nêu nhà quản lý giám sát việc chuyển việc làm sang nước có chi phí lao động thấp phải đối mặt với sự phản đối từ các nhóm lao động (công đoàn, người lao động bị mất việc) và nhu cầu giải thích cho các bên liên quan.","w":"Toàn cầu hóa làm lực lượng lao động đa dạng hơn (A sai); C, D không liên quan."},{"c":1,"n":75,"s":"Bổ sung – câu 18","q":"Phát biểu nào sau đây đúng về tính cách?","o":["Tính cách chỉ có thể được đo lường thông qua phỏng vấn cá nhân.","Tính cách không thay đổi theo thời gian.","Tính cách không chịu ảnh hưởng của môi trường.","Tính cách chịu ảnh hưởng của yếu tố di truyền."],"a":3,"e":"Tính cách chịu ảnh hưởng của di truyền (và cả môi trường).","w":"A sai vì tính cách đo được bằng bảng tự đánh giá và quan sát; B sai vì tính cách có thể thay đổi dần theo thời gian; C sai vì môi trường có ảnh hưởng."},{"c":0,"n":76,"s":"Bổ sung – câu 19","q":"Chức năng quản trị ____ liên quan đến việc tạo ra sự nhiệt tình làm việc chăm chỉ trong các thành viên của tổ chức.","o":["Động viên","Hoạch định","Kiểm soát","Lãnh đạo"],"a":3,"e":"Theo Schermerhorn, lãnh đạo (leading) là chức năng khơi dậy sự nhiệt tình làm việc chăm chỉ ở các thành viên và hướng nỗ lực của họ vào mục tiêu chung.","w":"\"Động viên\" là một hoạt động bên trong chức năng lãnh đạo, không phải một chức năng quản trị riêng; hoạch định và kiểm soát là các chức năng khác."},{"c":2,"n":77,"s":"Bổ sung – câu 21","q":"Những người có nhu cầu thành tựu cao ưa thích những công việc có:","o":["Tất cả đều đúng","Phản hồi","Trách nhiệm cá nhân","Mức độ rủi ro vừa phải"],"a":0,"e":"Người có nhu cầu thành tựu cao ưa thích công việc có trách nhiệm cá nhân, phản hồi và mức độ rủi ro vừa phải. Vì vậy tất cả đều đúng."},{"c":2,"n":78,"s":"Bổ sung – câu 22","q":"Smith là kế toán thuế, tự sắp xếp lịch làm việc với khách hàng của mình. Smith đang có ____ .","o":["Quyền tự chủ cao","Phản hồi cao","Quyền tự chủ thấp","Ý nghĩa nhiệm vụ cao"],"a":0,"e":"Smith tự sắp xếp lịch làm việc với khách hàng, tức là có mức độ tự do và tự quyết lớn trong công việc: quyền tự chủ cao.","w":"Tình huống không nói đến phản hồi hay tác động đến người khác (ý nghĩa nhiệm vụ)."}]},$=id=>document.getElementById(id),L="ABCD";
let sel=new Set(D.chapters.map((_,i)=>i)),cfg={n:20,t:30,timer:true,shuf:true},list=[],idx=0,ans={},tmr=null,left=0;
const key=q=>q.c+'-'+q.n,pool=()=>D.qs.filter(q=>sel.has(q.c));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cnt=i=>D.qs.filter(q=>q.c===i).length;
function nm(i){const [a,b]=D.chapters[i].split(/:\s*/);const n=a.replace('Chương','Ch.');if(!b)return n;const l=b.toLocaleLowerCase('vi');return n+' — '+l[0].toLocaleUpperCase('vi')+l.slice(1)}
$('tot').textContent=D.qs.length+' câu hỏi trong ngân hàng';
function setup(){
  clearInterval(tmr);
  const max=Math.max(pool().length,1);if(cfg.n>max)cfg.n=max;
  $('app').innerHTML=`<section class="box"><h2>1. Chọn chương</h2><div class="grid">${D.chapters.map((_,i)=>`<button class="ch${sel.has(i)?' on':''}" data-i="${i}"><span>${esc(nm(i))}</span><small class="mono">${cnt(i)} câu</small></button>`).join('')}</div></section>
<section class="box"><h2>2. Số câu trong đề thi</h2><div class="sl"><input type="range" id="rn" min="1" max="${max}" value="${cfg.n}"><b class="mono" id="vn">${cfg.n}</b><span>câu / đề</span></div></section>
<section class="box"><h2>3. Thời gian mỗi câu</h2><div class="sl"><input type="range" id="rt" min="5" max="120" step="5" value="${cfg.t}"><b class="mono" id="vt">${cfg.t}s</b><span>giây / câu</span></div>
<button class="tg${cfg.timer?' on':''}" id="tt">Đếm ngược từng câu <em>${cfg.timer?'Bật':'Tắt'}</em></button>
<button class="tg${cfg.shuf?' on':''}" id="ts">Trộn thứ tự câu hỏi <em>${cfg.shuf?'Bật':'Tắt'}</em></button></section>
<button class="go" id="go">Bắt đầu làm bài →</button>`;
  document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){if(sel.size>1)sel.delete(i)}else sel.add(i);setup()});
  $('rn').oninput=e=>{cfg.n=+e.target.value;$('vn').textContent=cfg.n};
  $('rt').oninput=e=>{cfg.t=+e.target.value;$('vt').textContent=cfg.t+'s'};
  $('tt').onclick=()=>{cfg.timer=!cfg.timer;setup()};
  $('ts').onclick=()=>{cfg.shuf=!cfg.shuf;setup()};
  $('go').onclick=()=>start(false);
}
function start(onlyWrong){
  let base=onlyWrong?list.filter(q=>ans[key(q)]!==q.a):pool();
  base=base.slice().sort(()=>Math.random()-.5);
  if(!onlyWrong)base=base.slice(0,cfg.n);
  if(!cfg.shuf)base.sort((x,y)=>x.c-y.c||x.n-y.n);
  list=base;ans={};idx=0;render();scrollTo(0,0);
}
const exh=q=>{const p=(l,x)=>x?`<p class="w"><b>${l}</b> ${esc(x)}</p>`:'';return `<div class="ex">${q.e?`<p>${esc(q.e)}</p>`:''}${p('Vì sao các phương án khác sai:',q.w)}${p('Lưu ý:',q.l)}${q.i?'<p class="w"><b>Đáp án suy luận:</b> đề gốc thiếu dữ kiện hoặc có nhiều cách hiểu.</p>':''}</div>`};
const score=()=>list.filter(q=>ans[key(q)]===q.a).length;
function render(){
  clearInterval(tmr);
  const done=Object.keys(ans).length,s=score(),m=$('app');
  const head=(t)=>`<div class="top"><button class="nv" id="bk">← Cài đặt</button><span>${t}</span><span class="mono">Đúng ${s} / ${done}</span></div><div class="prog"><i style="width:${done/list.length*100}%"></i></div>`;
  if(idx>=list.length){
    const w=list.length-s;
    m.innerHTML=head('Hoàn thành')+`<div class="box end"><div>Kết quả của bạn</div><div class="big mono">${s} / ${list.length}</div><div>${Math.round(s/list.length*100)}% câu đúng</div><div class="row"><button class="nv p" id="again">Làm lại từ đầu</button>${w?`<button class="nv" id="wrong">Làm lại ${w} câu sai</button>`:''}</div></div>`;
    $('bk').onclick=setup;$('again').onclick=()=>start(false);if(w)$('wrong').onclick=()=>start(true);return;
  }
  const q=list[idx],k=key(q),a=ans[k],has=a!==undefined,T=cfg.timer?cfg.t:0;
  m.innerHTML=head('Câu '+(idx+1)+' / '+list.length+' · '+D.chapters[q.c].split(':')[0]+' · '+q.s)+`<div class="box">${T>0&&!has?`<div class="timer mono" id="tl">⏱ ${T}s</div>`:''}<p class="q">${esc(q.q)}</p>${q.o.map((t,i)=>{let c='';if(has){if(i===q.a)c=' ok';else if(i===a)c=' no'}return `<button class="opt${c}" data-i="${i}"${has?' disabled':''}><b>${has&&i===q.a?'✓':has&&i===a?'✗':L[i]}</b><span>${esc(t)}</span></button>`}).join('')}<div class="res ${has?(a===q.a?'ok':'no'):''}">${has?(a===q.a?'✓ Chính xác!':(a===-1?'⏰ Hết giờ! ':'✗ Sai rồi. ')+'Đáp án đúng là '+L[q.a]+'.'):''}</div>${has?exh(q):''}</div><div class="nav"><button class="nv" id="prev"${idx?'':' disabled'}>← Câu trước</button><button class="nv p" id="next">${idx===list.length-1?'Xem kết quả':'Câu sau →'}</button></div>`;
  $('bk').onclick=setup;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[k]=+b.dataset.i;render()});
  if(T>0&&!has){left=T;tmr=setInterval(()=>{left--;const e=$('tl');if(e){e.textContent='⏱ '+left+'s';e.classList.toggle('low',left<=5)}if(left<=0){clearInterval(tmr);ans[k]=-1;render()}},1000)}
  $('prev').onclick=()=>{idx--;render();scrollTo(0,0)};
  $('next').onclick=()=>{idx++;render();scrollTo(0,0)};
}
setup();
</script>
</body>
</html>
